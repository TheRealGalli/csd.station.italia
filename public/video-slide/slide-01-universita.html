<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Università e tesine · CSD-Station</title><style>/* Otto: a small desk companion, built from CSS so it remains crisp and light. */
.otto{--shell:#dce6c7;position:relative;width:150px;height:195px;isolation:isolate;filter:drop-shadow(0 15px 12px #101a1635);animation:otto-breathe 4s ease-in-out infinite;pointer-events:none}

.otto-head{position:absolute;left:13px;top:23px;width:124px;height:86px;border:1px solid #f4fae6;border-radius:32px 32px 26px 26px;background:linear-gradient(135deg,#f5f8e9 4%,#d6e0bd 45%,#a5b58d);box-shadow:inset -5px -6px 9px #75856033,inset 2px 2px 2px #fff,0 6px 0 #84966c;z-index:4;transform:rotate(-5deg)}
.otto-face{position:absolute;inset:16px 13px 14px;background:linear-gradient(140deg,#172f25,#263d2c);border-radius:19px 19px 17px 17px;box-shadow:inset 0 3px 8px #0007,0 1px 0 #fff;display:flex;align-items:center;justify-content:center;gap:22px;overflow:hidden}.otto-face:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#ffffff0d,transparent 45%)}
.otto-eye{height:18px;width:10px;background:#d6ff9f;border-radius:6px;box-shadow:0 0 9px #c5f47680;animation:otto-blink 7s infinite}.otto-mouth{position:absolute;width:13px;height:5px;border-bottom:2px solid #bdda92;bottom:10px;border-radius:0 0 10px 10px}.otto-cheek{position:absolute;width:8px;height:3px;background:#d3927380;border-radius:2px;bottom:23px;z-index:5}.cheek-left{left:21px}.cheek-right{right:21px}

.otto-body{position:absolute;left:35px;top:111px;width:81px;height:59px;border-radius:18px 18px 22px 22px;background:linear-gradient(130deg,#f0f5df,#cedbb5 55%,#95aa7c);box-shadow:inset -4px -4px 8px #6e875632,0 4px 0 #758d5a;border:1px solid #e7f1d3;z-index:3;text-align:center;padding-top:12px}.otto-body>span{font:8px ui-monospace,monospace;letter-spacing:3px;color:#526642}.otto-body>i{display:block;margin:7px auto 0;width:7px;height:7px;border-radius:50%;background:#567f34;box-shadow:0 0 0 3px #93ad7460}.otto-vents{font:13px monospace;color:#5d7644;position:absolute;bottom:0;left:33px;letter-spacing:1px}
.otto-arm{position:absolute;top:119px;width:19px;height:45px;border-radius:12px;background:linear-gradient(90deg,#879d70,#d6e4bb);z-index:2;transform-origin:top}.arm-left{left:16px;transform:rotate(16deg)}.arm-right{right:15px;transform:rotate(-17deg)}.otto-foot{position:absolute;top:170px;width:31px;height:15px;background:linear-gradient(#d3dfbe,#849d70);border-radius:8px 8px 5px 5px;box-shadow:0 3px 0 #586e4b}.foot-left{left:37px;transform:rotate(-9deg)}.foot-right{right:32px;transform:rotate(9deg)}.otto-shadow{position:absolute;bottom:0;left:20px;width:112px;height:12px;border-radius:50%;background:#16301940;filter:blur(6px);z-index:-1}
.otto-sleep .otto-eye{height:3px;animation:none;transform:rotate(-7deg)}.otto-sleep .otto-head{transform:rotate(-12deg) translateY(5px)}.otto-sleep .otto-aerial i{box-shadow:none;background:#9aa983}.otto-sleep .otto-mouth{height:5px;width:5px;border:1px solid #c5f476;border-radius:50%}.otto-busy .otto-aerial i{animation:otto-signal .8s ease-in-out infinite}.otto-busy .arm-right{animation:otto-wave .7s ease-in-out infinite alternate}.otto-happy .otto-eye{height:10px;background:transparent;border-top:4px solid #d6ff9f;border-radius:50%;box-shadow:none;animation:none}.otto-happy .arm-right{transform:rotate(-135deg)}.otto-happy .otto-mouth{height:7px;width:16px;background:#bdda92;border-radius:3px 3px 10px 10px}.otto-small{transform:scale(.43);transform-origin:top left;animation:none}
.otto,.otto *{animation:none!important;transition:none!important}

<header><b>CSD Station</b><span>PRESENTAZIONE INTERATTIVA / UNIVERSITÀ</span></header><main><section><span class="label" id="label"></span><h1 id="title"></h1><p id="body"></p><div><button class="jump" onclick="go(5)">Grafico</button><button class="jump" onclick="go(3)">Metodo</button><button class="jump" onclick="go(11)">Limiti</button></div></section><aside class="visual" id="visual"></aside></main><footer><button id="prev" onclick="go(index-1)">← Indietro</button><div class="index"><span id="counter"></span><select id="menu" aria-label="Vai alla slide" onchange="go(Number(this.value))"></select></div><button id="next" onclick="go(index+1)">Avanti →</button></footer><div class="note">Caso dimostrativo CSD-Station. Dati simulati: nessuna indagine reale. Usa anche le frecce della tastiera.</div><script>const data={"schemaVersion": 1, "brand": "CSD-Station", "title": "La tua tesina. Tutta da esplorare.", "topic": "Come ci muoviamo verso il campus?", "palette": {"bg": "#101510", "lime": "#c5f476", "paper": "#f6f7f2", "ink": "#121712", "muted": "#9eac96"}, "research": {"simulated": true, "sample": 240, "period": "Ottobre 2026", "unit": "studenti", "counts": [96, 72, 48, 24], "labels": ["Bus e treno", "Auto", "Bici", "A piedi"], "note": "Dati simulati a scopo dimostrativo. Campione ipotetico di 240 studenti."}, "offer": {"video": 99, "videoMinutes": 2, "slides": 49, "slideCount": 15}, "audio": [{"frame": 18, "kind": "pop", "gain": 0.55}, {"frame": 120, "kind": "whoosh", "gain": 0.7}, {"frame": 155, "kind": "click", "gain": 0.6}, {"frame": 185, "kind": "pop", "gain": 0.5}, {"frame": 215, "kind": "pop", "gain": 0.5}, {"frame": 300, "kind": "whoosh", "gain": 0.7}, {"frame": 322, "kind": "rise", "gain": 0.55}, {"frame": 410, "kind": "click", "gain": 0.7}, {"frame": 420, "kind": "pop", "gain": 0.55}, {"frame": 510, "kind": "whoosh", "gain": 0.7}, {"frame": 570, "kind": "click", "gain": 0.7}, {"frame": 630, "kind": "click", "gain": 0.7}, {"frame": 720, "kind": "whoosh", "gain": 0.7}, {"frame": 750, "kind": "pop", "gain": 0.6}], "scenes": [{"id": "intro", "from": 0, "duration": 120}, {"id": "outline", "from": 120, "duration": 180}, {"id": "chart", "from": 300, "duration": 210}, {"id": "slides", "from": 510, "duration": 210}, {"id": "offer", "from": 720, "duration": 180}], "slides": [{"id": "cover", "title": "Mobilità del campus", "body": "Una tesina da esplorare, insieme a Otto."}, {"id": "question", "title": "Come arriviamo al campus?", "body": "La domanda di ricerca riguarda il mezzo usato più spesso per raggiungere le lezioni."}, {"id": "scope", "title": "Un caso di studio dimostrativo", "body": "240 studenti ipotetici. Nessun dato proviene da un’indagine reale."}, {"id": "method", "title": "Il metodo", "body": "Questionario con una sola scelta sul mezzo principale. Nessun dato personale."}, {"id": "sample", "title": "Il campione", "body": "240 risposte complete nel campione simulato. Periodo ipotetico: ottobre 2026."}, {"id": "chart", "title": "Il trasporto collettivo è il più usato", "body": "Bus e treno: 96 studenti su 240, pari al 40%."}, {"id": "bus", "title": "96 studenti scelgono bus o treno", "body": "Il dato aggrega i due mezzi. Non distingue tratte, frequenza o distanza."}, {"id": "auto", "title": "72 studenti usano l’auto", "body": "Il 30% del campione simulato. Non sappiamo quanti condividano il viaggio."}, {"id": "bike", "title": "48 studenti arrivano in bici", "body": "Il 20% del campione. Il dato non misura la disponibilità di piste ciclabili."}, {"id": "walk", "title": "24 studenti arrivano a piedi", "body": "Il 10% del campione. La distanza dal campus potrebbe influire sulla scelta."}, {"id": "compare", "title": "70% usa un’alternativa all’auto", "body": "168 su 240 scelgono trasporto collettivo, bici o cammino."}, {"id": "limits", "title": "I limiti del caso", "body": "Campione simulato, nessuna rappresentatività statistica. Le percentuali descrivono solo l’esempio."}, {"id": "next", "title": "Una possibile indagine function go(i){index=Math.max(0,Math.min(14,i));const s=data.slides[index];$('label').textContent='Mobilità del campus / '+String(index+1).padStart(2,'0');$('title').textContent=s.title;$('body').textContent=s.body;$('counter').textContent=(index+1)+' / 15';$('menu').value=index;$('prev').disabled=index===0;$('next').disabled=index===14;let v='';if(index===0||index===13)v='<div class="big-otto">'+otto+'</div>';else if(index===5){v='<div class="chart">'+data.research.labels.map((l,j)=>'<button class="row" onclick="detail('+j+')"><span>'+l+'<b>'+data.research.counts[j]/240*100+'%</b></span><div class="track"><div class="fill" style="width:'+data.research.counts[j]/240*100+'%"></div></div></button>').join('')+'<div class="detail" id="detail">Seleziona una barra per il dettaglio.</div></div>';}else if(index>=6&&index<=9){const j=index-6;v='<div class="stat"><div class="big">'+data.research.counts[j]/240*100+'%</div><div class="sub">'+data.research.counts[j]+' studenti su 240</div></div>';}else if(index===4||index===10)v='<div class="stat"><div class="big">'+(index===4?'240':'70%')+'</div><div class="sub">'+(index===4?'risposte complete, simulate':'168 studenti su 240')+'</div></div>';else if(index===14)v='<div class="cards"><div class="card offers">49 €<small>15 slide interattive</small></div><div class="card offers">99 €<small>ogni 2 minuti di video motion</small></div></div>';else{const sets={1:['La domanda','Il metodo','I risultati'],2:['Scenario ipotetico','Nessun dato personale'],3:['Questionario a scelta singola','Mezzo principale','Campione definito'],11:['Dati simulati','Nessuna rappresentatività','Nessuna conclusione causale'],12:['Definire il campione','Raccogliere distanza e tempi','Verificare le fonti']};v='<div class="cards">'+(sets[index]||['Domanda','Metodo','Risultati']).map((x,k)=>'<div class="card">0'+(k+1)+'　'+x+'</div>').join('')+'</div>';}if(index!==0&&index!==13)v+='<div class="mascot">'+otto+'</div>';$('visual').innerHTML=v;history.replaceState(null,'','#slide-'+(index+1));}
function detail(j){$('detail').textContent=data.research.labels[j]+': '+data.research.counts[j]+' su 240 ('+data.research.counts[j]/240*100+'%). Dati simulati.'}
window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});go(Number(location.hash.replace('#slide-',''))-1||0);</script></html>
